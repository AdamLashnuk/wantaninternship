AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Software and engineering opportunity collector and public API for WantAnInternship

Parameters:
  AllowedOrigin:
    Type: String
    Default: "https://wantaninternship.com"
    Description: Website origin allowed to call the public internship API

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 60
    Environment:
      Variables:
        TABLE_NAME: !Ref InternshipsTable

Resources:
  AccountsUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-accounts"
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Mutable: true
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your WantAnInternship verification code"
        EmailMessage: "Your verification code is {####}. Enter it to finish creating your WantAnInternship account."
  AccountsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: wantaninternship-web
      UserPoolId: !Ref AccountsUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  ApplicationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: applications.handler
      Timeout: 30
      Environment:
        Variables:
          APPLICATIONS_TABLE: !Ref ApplicationsTable
          ACCOUNTS_CLIENT_ID: !Ref AccountsUserPoolClient
          ACCOUNTS_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AccountsUserPool}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        Applications:
          Type: HttpApi
          Properties:
            ApiId: !Ref InternshipApi
            Path: /applications
            Method: ANY

  InternshipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: categoryStatus
          AttributeType: S
        - AttributeName: discoverySort
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-discovery-index
          KeySchema:
            - AttributeName: categoryStatus
              KeyType: HASH
            - AttributeName: discoverySort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  InternshipApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
        AllowOrigins:
          - !Ref AllowedOrigin
        MaxAge: 600

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: collect.handler
      Description: Collects software and engineering opportunities from ATS and GitHub discovery sources
      MemorySize: 768
      Timeout: 180
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InternshipsTable
      Events:
        EveryHour:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

  ReadInternshipsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: read.handler
      Description: Returns active software or engineering opportunities newest first
      Timeout: 15
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InternshipsTable
      Events:
        GetInternships:
          Type: HttpApi
          Properties:
            ApiId: !Ref InternshipApi
            Path: /internships
            Method: GET

Outputs:
  InternshipApiUrl:
    Description: Set INTERNSHIPS_API_URL in Vercel to this URL
    Value: !Sub "https://${InternshipApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/internships"
  CollectorFunctionName:
    Description: Invoke this once after deployment to populate the table immediately
    Value: !Ref CollectorFunction

  AccountsClientId:
    Description: Set COGNITO_CLIENT_ID in Vercel to this value
    Value: !Ref AccountsUserPoolClient
  AccountsRegion:
    Description: Set COGNITO_REGION in Vercel to this value
    Value: !Ref AWS::Region
